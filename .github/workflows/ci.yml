name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.7.4
      - run: ruff check server

  test-server:
    # The real server (uvicorn main:app) against a real PostgreSQL: the guest
    # scope is a middleware and the challenge nonce a transaction, and neither
    # can be trusted to a mock.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r server/requirements.txt -r server/requirements-dev.txt
      - run: pytest server/tests -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

  lint-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: chrome_extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  test-android:
    # Node 22 is the floor Android/package.json declares (engines). On 20 the
    # extension-crypto suites fail: its WebCrypto refuses typed arrays made in
    # the Jest sandbox ("is not instance of ArrayBuffer ..."), which 22 accepts.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: Android/package-lock.json
      - run: npm ci --legacy-peer-deps
      # The whole offline suite, not just the crypto primitives: the selector
      # project is where the key-trust gate, the signed wraps, the entry-point
      # failover and the cross-island client are covered, and until now it ran
      # nowhere but the author's machine. The integration project is left out
      # on purpose - it needs two live islands.
      - run: npm run test:unit
      # Screens rendered with their services stubbed (react-test-renderer).
      # Only src/screens: App.test.tsx needs native modules a node runner does
      # not have.
      - run: npm run test:screens
      - run: npm run lint

  test-deploy:
    # scripts/deploy/wsapp-deploy runs as root on the production island, and
    # deploy.yml only runs after this whole workflow passed - so a deploy
    # script that stopped refusing what it must refuse, or stopped rolling
    # back, never gets to deploy itself. Real git, runuser and flock in a
    # throwaway Ubuntu 24.04 container; systemctl, curl and pip are stubs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker run --rm -v "$PWD/scripts/deploy:/src:ro" buildpack-deps:noble-scm sh /src/test-wsapp-deploy.sh
